name: Wiki change log

on: gollum

permissions: {}

jobs:
  log-wiki-changes:
    runs-on: ubuntu-latest
    steps:
      - name: List changed wiki pages in the job summary
        env:
          PAGES: ${{ toJSON(github.event.pages) }}
          WIKI_EDITOR: ${{ github.event.sender.login }}
        run: |
          {
            echo "## Wiki updated by ${WIKI_EDITOR}"
            echo
            echo "$PAGES" | jq -r '.[] | "- **\(.action)**: [\(.title)](\(.html_url))"'
          } >> "$GITHUB_STEP_SUMMARY"
